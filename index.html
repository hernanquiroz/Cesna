
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cessna 172S - Dinámica de Vuelo Continua</title>
    <style>
        :root {
            --bg: #F8F5FF;
            --panel: #FFFFFF;
            --text: #2E1065;
            --accent: #8B5CF6;
            --danger: #EF4444;
            --success: #10B981;
            --sky: #4A90E2;
            --earth: #8B4513;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            user-select: none; -webkit-user-select: none;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { margin: 0; color: var(--accent); font-size: 22px; }
        .header p { margin: 2px 0; font-weight: bold; font-size: 12px; color: #666; }

        .dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 900px;
        }

        .panel {
            background: var(--panel); border-radius: 12px; padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column;
        }

        .instruments-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        canvas { max-width: 100%; height: auto; }

        /* Controles */
        .controls-panel {
            display: flex; flex-direction: column; gap: 15px;
        }
        .slider-group {
            display: flex; flex-direction: column;
        }
        .slider-group label {
            font-weight: bold; font-size: 14px; margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        input[type=range] {
            -webkit-appearance: none; width: 100%; height: 15px; border-radius: 8px;
            background: #E5E7EB; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 25px; height: 25px;
            border-radius: 50%; background: var(--accent); cursor: pointer;
        }

        /* Gráfica Continua */
        #graph-canvas { width: 100%; height: 150px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; }

        .status-bar {
            grid-column: span 2; background: var(--success); color: white;
            padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px;
            transition: background 0.3s;
        }

        .data-row { display: flex; justify-content: space-around; font-size: 14px; font-weight: bold; margin-top: 5px;}

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .status-bar { grid-column: span 1; }
            .instruments-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✈️ Cessna 172S - Física Continua</h1>
        <p>Diseño: Ing. Hernán Quiroz | Desarrollado para Pilotos e Ingenieros</p>
    </div>

    <div class="dashboard">
        <div class="status-bar" id="status-banner">Iniciando Sistemas...</div>

        <!-- Columna Izquierda: Instrumentos -->
        <div class="panel">
            <div class="instruments-grid">
                <div>
                    <canvas id="canvas-airspeed" width="200" height="200"></canvas>
                    <div class="data-row"><span id="txt-airspeed">0 KIAS</span></div>
                </div>
                <div>
                    <canvas id="canvas-altimeter" width="200" height="200"></canvas>
                    <div class="data-row"><span id="txt-altimeter">0 ft</span></div>
                </div>
                <div>
                    <canvas id="canvas-attitude" width="200" height="200"></canvas>
                    <div class="data-row"><span id="txt-pitch">0° Pitch</span></div>
                </div>
                <div>
                    <canvas id="canvas-power" width="200" height="200"></canvas>
                    <div class="data-row"><span id="txt-power">0%</span></div>
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Controles y Telemetría -->
        <div class="panel">
            <div class="controls-panel">
                <div class="slider-group">
                    <label>Potencia del Motor (RPM) <span id="val-throttle">0%</span></label>
                    <input type="range" id="throttle" min="0" max="100" value="0" oninput="updateControls()">
                </div>
                <div class="slider-group">
                    <label>Flaps <span id="val-flaps">0°</span></label>
                    <input type="range" id="flaps" min="0" max="30" step="10" value="0" oninput="updateControls()">
                </div>
                <div class="slider-group">
                    <label>Control de Morro (Pitch) <span id="val-pitch">0°</span></label>
                    <input type="range" id="pitch" min="-15" max="20" value="0" oninput="updateControls()">
                </div>
                
                <div style="font-size: 12px; color: #666; margin-top: 10px;">
                    <b>Fuerzas Activas:</b><br>
                    Sustentación: <span id="val-lift" style="color:var(--success);">0</span> lbs | 
                    Arrastre: <span id="val-drag" style="color:var(--danger);">0</span> lbs<br>
                    Ángulo de Ataque (AoA): <span id="val-aoa" style="font-weight:bold;">0°</span>
                </div>
            </div>
        </div>

        <!-- Fila Inferior: Gráfica Continua -->
        <div class="panel" style="grid-column: 1 / -1;">
            <label style="font-weight: bold; margin-bottom: 5px; font-size: 14px;">📈 Registro de Vuelo (Tiempo Real: Velocidad vs Altitud)</label>
            <canvas id="graph-canvas" width="800" height="150"></canvas>
        </div>
    </div>

    <script>
        // --- CONSTANTES FÍSICAS ---
        const G = 32.174; // ft/s²
        const S = 174; // Área alar ft²
        const MTOW = 2550; // Peso máximo lbs
        const EMPTY_WEIGHT = 1663; // Peso vacío lbs
        const FUEL_WEIGHT = 240; // Simulando 40 galones
        const BASE_WEIGHT = EMPTY_WEIGHT + 180 + FUEL_WEIGHT; // Piloto + Combustible
        const MAX_THRUST_LBS = 450;
        const CD0_CLEAN = 0.031;

        // --- ESTADO DEL SIMULADOR ---
        let state = {
            velocity: 0,       // ft/s (0 inicial)
            altitude: 0,       // ft
            pitch: 0,          // grados (elevador)
            throttle: 0,       // 0-100%
            flaps: 0,          // 0, 10, 20, 30 grados
            isAirborne: false,
            weight: BASE_WEIGHT,
            aoa: 0,
            lift: 0,
            drag: 0
        };

        // Variables para la gráfica
        let graphData = { time: [], speed: [], alt: [] };
        let timeElapsed = 0;

        // Elementos UI
        const els = {
            throttle: document.getElementById('throttle'),
            flaps: document.getElementById('flaps'),
            pitch: document.getElementById('pitch'),
            valThrottle: document.getElementById('val-throttle'),
            valFlaps: document.getElementById('val-flaps'),
            valPitch: document.getElementById('val-pitch'),
            txtSpeed: document.getElementById('txt-airspeed'),
            txtAlt: document.getElementById('txt-altimeter'),
            txtPower: document.getElementById('txt-power'),
            banner: document.getElementById('status-banner')
        };

        function updateControls() {
            state.throttle = parseFloat(els.throttle.value);
            state.flaps = parseFloat(els.flaps.value);
            state.pitch = parseFloat(els.pitch.value);
            
            els.valThrottle.innerText = state.throttle + "%";
            els.valFlaps.innerText = state.flaps + "°";
            els.valPitch.innerText = state.pitch + "°";
        }

        // --- BUCLE PRINCIPAL FÍSICO ---
        let lastTime = performance.now();
        
        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1; // Evitar saltos si la pestaña se oculta

            updateFlightDynamics(dt);
            renderUI();
            
            timeElapsed += dt;
            if (timeElapsed > 0.1) { // Guardar punto en la gráfica cada 0.1s
                recordGraphData();
                timeElapsed = 0;
            }
            drawGraph();

            requestAnimationFrame(loop);
        }

        function updateFlightDynamics(dt) {
            const rho = 0.002377; // Densidad nivel del mar (simplificada)
            
            // 1. Calcular sustentación requerida para volar nivelado (Cl_required)
            const q = 0.5 * rho * (state.velocity ** 2);
            
            // El ángulo de ataque (AoA) es la diferencia entre donde apunta el morro (Pitch)
            // y la trayectoria real de vuelo. En este simulador 2D simplificado:
            let cl_flaps = state.flaps * 0.015; // Los flaps aumentan el Cl base
            let cl_base = 0.2 + cl_flaps + (state.pitch * 0.06);
            
            // Si estamos en tierra
            if (!state.isAirborne && state.velocity < 50) {
                cl_base = 0.2 + cl_flaps; 
            }
            
            if (cl_base < 0) cl_base = 0;
            if (cl_base > 1.8) cl_base = 1.8; // Stall aerodinámico
            
            state.lift = q * S * cl_base;
            
            // Arrastre (Cd) - Aumenta con los flaps y con la sustentación
            let cd0 = CD0_CLEAN + (state.flaps * 0.002);
            let cd_induced = (cl_base ** 2) / (Math.PI * 0.85 * 7.32);
            state.drag = q * S * (cd0 + cd_induced);

            // Empuje (Thrust) - Disminuye con la velocidad
            let thrust = 0;
            if (state.throttle > 0) {
                let max_t = (state.throttle / 100) * MAX_THRUST_LBS;
                if (state.velocity > 50) {
                    thrust = max_t * (50 / state.velocity); // Simplificación de hélice
                } else {
                    thrust = max_t;
                }
            }

            // Integración de fuerzas
            const mass = state.weight / G;
            
            // Aceleración horizontal (Velocidad)
            // Si está en tierra, hay fricción
            let friction = state.isAirborne ? 0 : (state.weight * 0.04);
            
            // Componente del peso (si el morro está arriba, el avión frena)
            let gravity_component = state.weight * Math.sin(state.pitch * Math.PI / 180);

            let net_force_x = thrust - state.drag - friction - gravity_component;
            state.velocity += (net_force_x / mass) * dt;
            if (state.velocity < 0) state.velocity = 0;

            // Fuerza Vertical (Ascenso/Descenso)
            let net_lift = state.lift - (state.weight * Math.cos(state.pitch * Math.PI / 180));
            
            if (state.isAirborne) {
                let vertical_accel = net_lift / mass;
                // Integramos para obtener velocidad vertical (aprox)
                let vertical_speed = vertical_accel * 10; 
                state.altitude += vertical_speed * dt;

                if (state.altitude <= 0 && vertical_speed < 0) {
                    state.altitude = 0;
                    state.isAirborne = false;
                }
            } else {
                // Chequeo de despegue
                if (state.lift > state.weight && state.pitch > 0) {
                    state.isAirborne = true;
                }
            }

            // Chequeo de Stall (Pérdida)
            let stall_speed = Math.sqrt((2 * state.weight) / (rho * S * 1.8));
            if (state.isAirborne && state.velocity < stall_speed && state.pitch > 2) {
                // Stall: El avión cae bruscamente
                state.altitude -= 50 * dt;
                state.pitch -= 20 * dt;
                els.banner.style.background = 'var(--danger)';
                els.banner.innerText = '🚨 ¡STALL! - Baje el morro';
            } else {
                // Actualizar Banner
                if (!state.isAirborne) {
                    els.banner.style.background = 'var(--success)';
                    els.banner.innerText = '🛩️ En Tierra (Rodando)';
                } else {
                    els.banner.style.background = 'var(--accent)';
                    els.banner.innerText = '✈️ En Vuelo';
                }
            }

            // Consumo de Combustible
            if (state.throttle > 0) {
                state.weight -= 0.01 * dt; // Pérdida de peso gradual
            }
        }

        // --- RENDERIZADO UI ---
        function renderUI() {
            let kts = state.velocity / 1.68781;
            els.txtSpeed.innerText = kts.toFixed(0) + " KIAS";
            els.txtAlt.innerText = state.altitude.toFixed(0) + " ft";
            els.txtPower.innerText = state.throttle + "%";
            
            document.getElementById('val-lift').innerText = state.lift.toFixed(0);
            document.getElementById('val-drag').innerText = state.drag.toFixed(0);
            
            // Cálculo aproximado del AoA para mostrar
            let aoa = state.pitch - (state.isAirborne ? 2 : 0); 
            document.getElementById('val-aoa').innerText = aoa.toFixed(1) + "°";

            drawAirspeed(kts);
            drawAltimeter(state.altitude);
            drawPower(state.throttle);
            drawAttitude(state.pitch, 0);
        }

        // --- GRÁFICA CONTINUA ---
        function recordGraphData() {
            graphData.time.push(timeElapsed);
            graphData.speed.push(state.velocity / 1.68781); // KIAS
            graphData.alt.push(state.altitude);
            
            // Mantener solo los últimos 100 puntos
            if (graphData.time.length > 100) {
                graphData.time.shift(); graphData.speed.shift(); graphData.alt.shift();
            }
        }

        function drawGraph() {
            const canvas = document.getElementById('graph-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (graphData.speed.length < 2) return;

            const maxSpeed = 180;
            const maxAlt = 12000;
            
            // Dibujar Línea de Velocidad (Azul)
            ctx.beginPath();
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 2;
            for (let i = 0; i < graphData.speed.length; i++) {
                let x = (i / 100) * canvas.width;
                let y = canvas.height - ((graphData.speed[i] / maxSpeed) * canvas.height);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Dibujar Línea de Altitud (Verde)
            ctx.beginPath();
            ctx.strokeStyle = 'green';
            ctx.lineWidth = 2;
            for (let i = 0; i < graphData.alt.length; i++) {
                let x = (i / 100) * canvas.width;
                let y = canvas.height - ((graphData.alt[i] / maxAlt) * canvas.height);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Leyenda
            ctx.fillStyle = 'blue'; ctx.fillRect(10, 10, 10, 10); ctx.fillStyle = 'black'; ctx.font = '12px Arial'; ctx.fillText('Velocidad', 25, 20);
            ctx.fillStyle = 'green'; ctx.fillRect(110, 10, 10, 10); ctx.fillStyle = 'black'; ctx.fillText('Altitud', 125, 20);
        }

        // --- FUNCIONES DE DIBUJO DE INSTRUMENTOS (Idénticas a la versión anterior para mantener diseño) ---
        function drawAirspeed(kts) {
            const ctx = document.getElementById('canvas-airspeed').getContext('2d');
            const cx = 100, cy = 100, r = 80;
            ctx.clearRect(0, 0, 200, 200);
            const start = 135 * Math.PI / 180, end = 405 * Math.PI / 180, sweep = end - start;
            const arc = (v1, v2, color, w) => {
                ctx.beginPath(); ctx.arc(cx, cy, r, start + (v1/200)*sweep, start + (v2/200)*sweep);
                ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
            };
            arc(0, 200, '#ddd', 15); arc(40, 85, '#fff', 11); arc(48, 129, 'green', 11); arc(129, 163, 'yellow', 11); arc(163, 163.1, 'red', 11);
            ctx.fillStyle = 'black'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = 0; i <= 200; i += 40) {
                let a = start + (i/200)*sweep;
                ctx.fillText(i, cx + Math.cos(a)*(r+15), cy + Math.sin(a)*(r+15));
            }
            let angle = start + (Math.min(kts, 200)/200)*sweep;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle)*(r-10), cy + Math.sin(angle)*(r-10));
            ctx.strokeStyle = 'red'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 2*Math.PI); ctx.fillStyle = 'black'; ctx.fill();
        }

        function drawAltimeter(alt) {
            const ctx = document.getElementById('canvas-altimeter').getContext('2d');
            const cx = 100, cy = 100, r = 80;
            ctx.clearRect(0, 0, 200, 200);
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = 'black'; ctx.font = '12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = 0; i < 10; i++) {
                let a = (i * 36 - 90) * Math.PI / 180;
                ctx.fillText(i, cx + Math.cos(a)*(r-15), cy + Math.sin(a)*(r-15));
            }
            const needle = (val, len, w, c) => {
                let a = (val * 360 - 90) * Math.PI / 180;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a)*len, cy + Math.sin(a)*len);
                ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke();
            };
            needle((alt % 100000) / 100000, r*0.5, 3, 'orange');
            needle((alt % 10000) / 10000, r*0.75, 3, 'green');
            needle((alt % 1000) / 1000, r*0.9, 2, 'black');
            ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 2*Math.PI); ctx.fillStyle = 'black'; ctx.fill();
        }

        function drawPower(power) {
            const ctx = document.getElementById('canvas-power').getContext('2d');
            const cx = 100, cy = 100, r = 80;
            ctx.clearRect(0, 0, 200, 200);
            const start = 135 * Math.PI / 180, end = 405 * Math.PI / 180, sweep = end - start;
            ctx.beginPath(); ctx.arc(cx, cy, r, start, end); ctx.strokeStyle = 'green'; ctx.lineWidth = 12; ctx.stroke();
            ctx.fillStyle = 'black'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = 0; i <= 100; i += 25) {
                let a = start + (i/100)*sweep;
                ctx.fillText(i + '%', cx + Math.cos(a)*(r+15), cy + Math.sin(a)*(r+15));
            }
            let angle = start + (Math.min(power, 100)/100)*sweep;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle)*(r-10), cy + Math.sin(angle)*(r-10));
            ctx.strokeStyle = 'red'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 2*Math.PI); ctx.fillStyle = 'black'; ctx.fill();
        }

        function drawAttitude(pitch, roll) {
            const ctx = document.getElementById('canvas-attitude').getContext('2d');
            const cx = 100, cy = 100, r = 80;
            ctx.clearRect(0, 0, 200, 200);
            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.clip();
            ctx.translate(cx, cy); ctx.rotate(roll * Math.PI / 180);
            let pitchOffset = pitch * 4; ctx.translate(0, pitchOffset);
            ctx.fillStyle = 'var(--sky)'; ctx.fillRect(-200, -200, 400, 200);
            ctx.fillStyle = 'var(--earth)'; ctx.fillRect(-200, 0, 400, 200);
            ctx.beginPath(); ctx.moveTo(-200, 0); ctx.lineTo(200, 0);
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.stroke();
            ctx.restore();
            ctx.beginPath(); ctx.moveTo(cx-25, cy); ctx.lineTo(cx+25, cy); ctx.moveTo(cx, cy-8); ctx.lineTo(cx, cy+8);
            ctx.strokeStyle = 'orange'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.strokeStyle = 'black'; ctx.lineWidth = 5; ctx.stroke();
        }

        // Iniciar simulación automáticamente
        window.onload = () => {
            updateControls();
            requestAnimationFrame(loop);
        };
    </script>
</body>
</html>
